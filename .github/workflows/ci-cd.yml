name: CI/CD & Auto-Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    name: Frontend CI & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Intermost-Frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './Intermost-Frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run npm audit security scan
      run: |
        npm audit --audit-level=high || true

  backend-ci:
    name: Backend CI & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Intermost-Backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit pip-audit

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Django System Checks
      run: |
        python manage.py check

    - name: Run Bandit SAST security scan
      run: |
        bandit -r . -x ./venv -ll -ii || true

    - name: Run pip-audit dependency scan
      run: |
        pip-audit -r requirements.txt || true

  deploy:
    name: Deploy to AWS EC2
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/intermost
          git pull origin main
          sudo systemctl stop nginx || true
          sudo systemctl disable nginx || true
          docker compose -f docker-compose.prod.yml up -d --build
