name: Backend CI & Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Intermost-Backend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 bandit pip-audit

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Django System Checks
      run: |
        python manage.py check

    - name: Run Bandit SAST security scan
      run: |
        bandit -r . -x ./venv -ll -ii

    - name: Run pip-audit dependency scan
      run: |
        pip-audit -r requirements.txt

    - name: Build Backend Docker Image
      run: |
        docker build -t intermost-backend:latest .
