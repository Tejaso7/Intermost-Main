name: Frontend CI & Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Intermost-Frontend

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: './Intermost-Frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Run npm audit security scan
      run: |
        npm audit --audit-level=high || true

    - name: Build Frontend Docker Image
      run: |
        docker build \
          --build-arg NEXT_PUBLIC_API_URL=https://intermost.in/api/v1 \
          --build-arg NEXT_PUBLIC_WHATSAPP_NUMBER=919058501818 \
          -t intermost-frontend:latest .
