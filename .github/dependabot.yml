version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain npm dependencies for Frontend
  - package-ecosystem: "npm"
    directory: "/Intermost-Frontend"
    schedule:
      interval: "weekly"

  # Maintain pip dependencies for Backend
  - package-ecosystem: "pip"
    directory: "/Intermost-Backend"
    schedule:
      interval: "weekly"
