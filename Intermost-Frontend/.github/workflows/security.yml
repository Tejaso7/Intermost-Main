name: Frontend Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1' # Runs every Monday at midnight

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Run npm audit
      run: |
        # Check dependencies for vulnerabilities (audit packages)
        # npm audit audit will fail on high/critical vulnerabilities depending on exit codes.
        # Use audit --audit-level=high to fail only on high/critical issues.
        npm audit --audit-level=high
